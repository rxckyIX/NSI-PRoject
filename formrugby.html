<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie Match - July Verny</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Enregistrer une nouvelle feuille de match</h1>
    <a href="dashboard_rugby.html">⬅ Annuler et retourner au Dashboard</a>

    <div class="form-container">
        <form action="/upload_rugby" method="POST">
            
            <h3>Informations Générales (Obligatoires)</h3>
            <input type="text" name="titre_match" placeholder="Titre du match (ex: Finale Inter-Lycee)" required><br>
            <input type="text" name="competition" placeholder="Ligue / Championnat / Tournoi" required><br>
            <input type="text" name="adversaire" placeholder="Équipe Adversaire" required><br>
            
            <label for="date_match">Date de la rencontre :</label><br>
            <input type="date" id="date_match" name="date_match" required><br>
            
            <h3>Résultats du Match (Obligatoires)</h3>
            <input type="number" name="score_notre_equipe" placeholder="Notre Score" min="0" required><br>
            <input type="number" name="score_adversaire" placeholder="Score Adversaire" min="0" required><br>
            
            <label for="resultat">Issue de la rencontre (Win or Loss) :</label><br>
            <select id="resultat" name="resultat" required>
                <option value="Victoire">Victoire 🟢</option>
                <option value="Défaite">Défaite 🔴</option>
                <option value="Nul">Match Nul 🟡</option>
            </select><br>

            <input type="number" name="essais" placeholder="Vos essais marqués (Tries score)" min="0" required><br>
            
            <label for="evaluation">Votre note personnelle du match (Rating) :</label><br>
            <select id="evaluation" name="evaluation" required>
                <option value="⭐">⭐ (Difficile)</option>
                <option value="⭐⭐">⭐⭐ (Moyen)</option>
                <option value="⭐⭐⭐">⭐⭐⭐ (Bon match)</option>
                <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (Excellent)</option>
                <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (Match parfait)</option>
            </select><br>

            <h3>Données Scientifiques Avancées (Optionnelles)</h3>
            <p style="font-size: 0.8em; color: #777; margin-bottom: 10px;">
                Laissez ces champs vides s'ils n'ont pas pu être mesurés (valeur par défaut : N/A).
            </p>
            <input type="number" name="passes" placeholder="Passes réussies"><br>
            <input type="number" name="plaquages" placeholder="Plaquages effectués"><br>
            <input type="number" name="temps_jeu" placeholder="Temps de jeu effectif (minutes)"><br>
            <input type="number" step="0.1" name="distance" placeholder="Distance de course (km)"><br>

            <button type="submit" style="margin-top: 20px; padding: 10px 20px; font-weight: bold; background-color: #2b2b2b; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Générer le fichier du match
            </button>
        </form>
    </div>
</body>
</html>
